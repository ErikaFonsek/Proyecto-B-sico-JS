<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📋 Registro de Usuarios</title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- CSS-->
   <link rel="stylesheet" href="css/style.css">



  <!-- Estilos propios -->
  <style>
    /* PANTALLA DE INICIO */
    #inicio {
      height: 100vh;
      background-image: url("images/fondApp.jpg");
      background-size: cover;
      background-position: center;
      display: flex;
      justify-content: center;
      align-items: first baseline;
    }

    /* Botón animado */
    .btn-ingresar {
      font-size: 1.5rem;
      padding: 14spx 40px;
      animation: pulse 1.5s infinite;
      background-color: blueviolet;
      margin-left: 5%;
      margin-top: 27%;
    
    }

    /* 0%: estado inicial → escala normal (scale(1))
    - 50%: estado intermedio → el elemento se agranda al 120% de su tamaño original (scale(1.2))
    - 100%: estado final → vuelve a la escala original (scale(1))*/

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    /* Ocultar formulario al inicio */
    #formulario {
      display: none;
    }
  </style>
</head>

<body>

  <!-- PANTALLA INICIAL -->
  <section id="inicio">
    <button class="btn btn-primary btn-ingresar" onclick="ingresar()">
      Ingresar
    </button>
  </section>

  <!-- FORMULARIO -->
   
  <section id="formulario" class="bg-light py-5">
    <div class="container">

      <!-- Card del formulario -->
      <div class="card shadow p-4">
        <h3 class="text-center mb-4">Formulario de Datos Personales</h3>

        <!-- Nombre -->
        <div class="mb-3">
          <label class="form-label">Nombre</label>
          <input type="text" id="nombre" class="form-control">
        </div>

        <!-- Apellido -->
        <div class="mb-3">
          <label class="form-label">Apellido</label>
          <input type="text" id="apellido" class="form-control">
        </div>

        <!-- Edad -->
        <div class="mb-3">
          <label class="form-label">Edad</label>
          <input type="number" id="edad" class="form-control" min="0">
        </div>

        <!-- Botón guardar -->
        <button class="btn btn-primary w-100" onclick="mostrarDatos()">
          Guardar Datos
        </button>

        <!-- Botón volver -->
        <button class="btn btn-secondary w-100 mt-2" onclick="volverInicio()">
          Volver al inicio
        </button>

        <hr>

        <!-- Mensajes -->
        <div id="resultado" class="mt-3 text-center fw-bold"></div>
      </div>

      <!-- Tabla -->
      <hr class="my-4">

      <h4>Usuarios registrados</h4>

      <table class="table table-bordered table-striped mt-3">
        <thead class="table-dark">
          <tr>
            <th>Nombre</th>
            <th>Apellido</th>
            <th>Edad</th>
          </tr>
        </thead>
        <tbody id="tablaUsuarios"></tbody>
      </table>

    </div>
  </section>

  <!-- JS PRINCIPAL -->
  <script src="js/app.js"></script>

  <!-- JS DE NAVEGACIÓN -->
  <script>
    function ingresar() {
      document.getElementById("inicio").style.display = "none";
      document.getElementById("formulario").style.display = "block";
    }

    function volverInicio() {
      document.getElementById("formulario").style.display = "none";
      document.getElementById("inicio").style.display = "flex";
    }
  </script>

</body>
</html>
